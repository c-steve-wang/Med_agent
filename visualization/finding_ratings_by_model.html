<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #199e70;"></span>Accurate</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #3987e5;"></span>Likely accurate</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #c98500;"></span>Partially accurate</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #e66767;"></span>Inaccurate</span>
</div>
<div style="position: relative; width: 100%; height: 320px;">
  <canvas id="ratingsChart" role="img" aria-label="Stacked bar chart of finding ratings by model. DeepSeek: 10 accurate, 32 likely accurate, 0 partially accurate, 14 inaccurate, n=56. OpenAI: 27 accurate, 74 likely accurate, 9 partially accurate, 0 inaccurate, n=110. OpenAI-5.6: 31 accurate, 25 likely accurate, 1 partially accurate, 5 inaccurate, n=62. Qwen: 16 accurate, 17 likely accurate, 2 partially accurate, 0 inaccurate, n=35.">Bar chart showing rating counts per model.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
const labels = ['DeepSeek', 'OpenAI', 'OpenAI-5.6', 'Qwen'];
const data = {
  labels,
  datasets: [
    { label: 'Accurate', data: [10, 27, 31, 16], backgroundColor: isDark ? '#199e70' : '#1baf7a' },
    { label: 'Likely accurate', data: [32, 74, 25, 17], backgroundColor: isDark ? '#3987e5' : '#2a78d6' },
    { label: 'Partially accurate', data: [0, 9, 1, 2], backgroundColor: isDark ? '#c98500' : '#eda100' },
    { label: 'Inaccurate', data: [14, 0, 5, 0], backgroundColor: isDark ? '#e66767' : '#e34948' }
  ]
};
new Chart(document.getElementById('ratingsChart'), {
  type: 'bar',
  data,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    scales: {
      x: { stacked: true, grid: { display: false } },
      y: { stacked: true, beginAtZero: true, grid: { color: isDark ? '#2c2c2a' : '#e1e0d9' }, ticks: { precision: 0 } }
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y}`
        }
      }
    }
  }
});
</script>
